<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>BIKI Valladolid</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f6f4;
      color: #18332a;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 18px;
      padding: 18px;
      border-radius: 16px;
      color: white;
      background: #087f5b;
    }

    header h1 { margin: 0 0 6px; font-size: 25px; }
    header p { margin: 0; opacity: .9; }
    main { max-width: 1000px; margin: auto; }

    #estado {
      margin: 12px 0;
      color: #52665d;
      font-size: 14px;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }

    .tarjeta {
      padding: 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px #0000000c;
    }

    .tarjeta span {
      display: block;
      color: #63766d;
      font-size: 14px;
    }

    .tarjeta strong {
      display: block;
      margin-top: 5px;
      font-size: 30px;
      color: #087f5b;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    h2 { margin: 24px 0 12px; font-size: 20px; }

    #buscarEstacion {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8d1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
      background: white;
    }

    #map {
      height: 400px;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #e2e9e5;
    }

    #estaciones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .estacion {
      background: white;
      border-radius: 12px;
      padding: 13px;
      box-shadow: 0 2px 7px #0000000b;
      cursor: pointer;
    }

    .estacion strong { display: block; margin-bottom: 7px; }
    .detalle { color: #52665d; font-size: 14px; }
    .sin-resultados { color: #63766d; }

    @media (max-width: 480px) {
      body { padding: 10px; }
      #map { height: 350px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>VALLADOLID · BIKI</h1>
    <p>Consulta bicicletas y estaciones en tiempo real</p>
  </header>

  <main>
    <div id="estado">Conectando con BIKI...</div>

    <div class="resumen">
      <div class="tarjeta">
        <span>Bicicletas disponibles</span>
        <strong id="bicis">—</strong>
      </div>
      <div class="tarjeta">
        <span>Anclajes libres</span>
        <strong id="anclajes">—</strong>
      </div>
    </div>

    <button id="actualizar" type="button">Actualizar ahora</button>

    <h2>Mapa de estaciones</h2>
    <input
      id="buscarEstacion"
      type="search"
      placeholder="Buscar estación por nombre..."
      autocomplete="off"
    >
    <div id="map"></div>

    <h2>Estaciones</h2>
    <div id="estaciones">
      <p class="sin-resultados">Cargando estaciones...</p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const URL_INFO =
      "https://valladolid.publicbikesystem.net/customer/gbfs/v2/es/station_information";

    const URL_ESTADO =
      "https://valladolid.publicbikesystem.net/customer/gbfs/v2/es/station_status";

    const estado = document.getElementById("estado");
    const bicis = document.getElementById("bicis");
    const anclajes = document.getElementById("anclajes");
    const contenedor = document.getElementById("estaciones");
    const buscador = document.getElementById("buscarEstacion");

    let estacionesActuales = [];
    let marcadores = new Map();
    let capaMarcadores = null;
    let mapa = null;

    function iniciarMapa() {
      if (typeof L === "undefined") {
        throw new Error("No se ha podido cargar la biblioteca del mapa.");
      }

      mapa = L.map("map").setView([41.6523, -4.7245], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap"
      }).addTo(mapa);

      capaMarcadores = L.layerGroup().addTo(mapa);
    }

    function crearPopup(estacion) {
      const caja = document.createElement("div");
      const nombre = document.createElement("strong");
      const detalle = document.createElement("div");

      nombre.textContent = estacion.name;
      detalle.textContent =
        estacion.bicis + " bicicletas · " + estacion.anclajes + " anclajes libres";

      caja.appendChild(nombre);
      caja.appendChild(detalle);
      return caja;
    }

    function dibujarEstaciones(estaciones) {
      contenedor.replaceChildren();
      capaMarcadores.clearLayers();
      marcadores.clear();

      estaciones.forEach(estacion => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "estacion";
        tarjeta.dataset.nombre = estacion.name.toLocaleLowerCase("es");

        const nombre = document.createElement("strong");
        nombre.textContent = estacion.name;

        const detalle = document.createElement("div");
        detalle.className = "detalle";
        detalle.textContent =
          estacion.bicis + " bicicletas disponibles · " +
          estacion.anclajes + " anclajes libres";

        tarjeta.appendChild(nombre);
        tarjeta.appendChild(detalle);

        tarjeta.addEventListener("click", () => {
          const marcador = marcadores.get(estacion.id);
          if (marcador) {
            mapa.setView(marcador.getLatLng(), 16);
            marcador.openPopup();
          }
        });

        contenedor.appendChild(tarjeta);

        const color = estacion.bicis === 0
          ? "#d62828"
          : estacion.bicis <= 3 ? "#f08c00" : "#087f5b";

        const marcador = L.circleMarker(
          [estacion.lat, estacion.lon],
          {
            radius: 9,
            color: color,
            fillColor: color,
            fillOpacity: 0.85,
            weight: 2
          }
        );

        marcador.bindPopup(crearPopup(estacion));
        marcador.addTo(capaMarcadores);
        marcadores.set(estacion.id, marcador);
      });

      if (estaciones.length === 0) {
        const mensaje = document.createElement("p");
        mensaje.className = "sin-resultados";
        mensaje.textContent = "No se han encontrado estaciones.";
        contenedor.appendChild(mensaje);
      }
    }

    async function actualizar() {
      estado.textContent = "Actualizando datos...";

      try {
        const respuestas = await Promise.all([
          fetch(URL_INFO, { cache: "no-store" }),
          fetch(URL_ESTADO, { cache: "no-store" })
        ]);

        if (!respuestas[0].ok || !respuestas[1].ok) {
          throw new Error("El servidor de BIKI no ha respondido correctamente.");
        }

        const [datosInfo, datosEstado] = await Promise.all([
          respuestas[0].json(),
          respuestas[1].json()
        ]);

        const informacion = datosInfo.data.stations;
        const estados = datosEstado.data.stations;

        const estadosPorId = new Map(
          estados.map(item => [String(item.station_id), item])
        );

        estacionesActuales = informacion
          .map(info => {
            const actual = estadosPorId.get(String(info.station_id));
            if (!actual) return null;

            return {
              id: String(info.station_id),
              name: info.name || "Estación sin nombre",
              lat: Number(info.lat),
              lon: Number(info.lon),
              bicis: Number(actual.num_bikes_available || 0),
              anclajes: Number(actual.num_docks_available || 0)
            };
          })
          .filter(item =>
            item &&
            Number.isFinite(item.lat) &&
            Number.isFinite(item.lon)
          )
          .sort((a, b) => a.name.localeCompare(b.name, "es"));

        const totalBicis = estacionesActuales.reduce(
          (total, item) => total + item.bicis, 0
        );

        const totalAnclajes = estacionesActuales.reduce(
          (total, item) => total + item.anclajes, 0
        );

        bicis.textContent = totalBicis;
        anclajes.textContent = totalAnclajes;

        dibujarEstaciones(estacionesActuales);
        filtrarEstaciones();

        estado.textContent =
          "Datos actualizados: " +
          new Date().toLocaleTimeString("es-ES") +
          " · " + estacionesActuales.length + " estaciones";
      } catch (error) {
        console.error("Error al actualizar BIKI:", error);
        estado.textContent = "Error de conexión: " + error.message;
      }
    }

    function filtrarEstaciones() {
      const texto = buscador.value.trim().toLocaleLowerCase("es");
      const tarjetas = contenedor.querySelectorAll(".estacion");
      let primeraCoincidencia = null;

      tarjetas.forEach(tarjeta => {
        const coincide = tarjeta.dataset.nombre.includes(texto);
        tarjeta.style.display = coincide ? "" : "none";

        if (coincide && !primeraCoincidencia) {
          primeraCoincidencia = tarjeta;
        }
      });

      if (texto && primeraCoincidencia) {
        const estacion = estacionesActuales.find(
          item => item.name.toLocaleLowerCase("es").includes(texto)
        );

        if (estacion) {
          const marcador = marcadores.get(estacion.id);
          if (marcador) {
            mapa.setView(marcador.getLatLng(), 16);
            marcador.openPopup();
          }
        }
      }
    }

    document.getElementById("actualizar").addEventListener("click", actualizar);
    buscador.addEventListener("input", filtrarEstaciones);

    try {
      iniciarMapa();
      actualizar();
      setInterval(actualizar, 30000);
    } catch (error) {
      console.error(error);
      estado.textContent = "Error al iniciar la página: " + error.message;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("BIKI: service worker registrado"))
          .catch(error => console.error("Error del service worker:", error));
      });
    }
  </script>
</body>
</html>
